name: SaneBooks
configs:
  Debug: debug
  Release: release

options:
  bundleIdPrefix: com.saneapps
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  SaneBooksPackage:
    path: SaneBooksPackage

settings:
  DEAD_CODE_STRIPPING: YES
  SWIFT_EMIT_LOC_STRINGS: YES
  ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES
  CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
  CLANG_WARN_BOOL_CONVERSION: YES
  CLANG_WARN_COMMA: YES
  CLANG_WARN_CONSTANT_CONVERSION: YES
  CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
  CLANG_WARN_EMPTY_BODY: YES
  CLANG_WARN_ENUM_CONVERSION: YES
  CLANG_WARN_INFINITE_RECURSION: YES
  CLANG_WARN_INT_CONVERSION: YES
  CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
  CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
  CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
  CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
  CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
  CLANG_WARN_STRICT_PROTOTYPES: YES
  CLANG_WARN_SUSPICIOUS_MOVE: YES
  CLANG_WARN_UNREACHABLE_CODE: YES
  CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
  ENABLE_STRICT_OBJC_MSGSEND: YES
  GCC_NO_COMMON_BLOCKS: YES
  GCC_WARN_64_TO_32_BIT_CONVERSION: YES
  GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
  GCC_WARN_UNDECLARED_SELECTOR: YES
  GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
  GCC_WARN_UNUSED_FUNCTION: YES
  GCC_WARN_UNUSED_VARIABLE: YES

schemes:
  SaneBooks:
    build:
      targets:
        SaneBooks: all
        SaneBooksTests: [test]
    test:
      targets:
        - SaneBooksTests
        - SaneBooksUITests
    run:
      config: Debug
    archive:
      config: Release

targets:
  SaneBooks:
    type: application
    platform: macOS
    bundleId: com.saneapps.SaneBooks
    deploymentTarget:
      macOS: "14.0"
    sources:
      - path: SaneBooks
        excludes:
          - "**/*.md"
          - "Info.plist"
          - "PrivacyInfo.xcprivacy"
      - SaneBooks/PrivacyInfo.xcprivacy
    settings:
      base:
        INFOPLIST_FILE: SaneBooks/Info.plist
        PRODUCT_NAME: SaneBooks
        PRODUCT_BUNDLE_IDENTIFIER: com.saneapps.SaneBooks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: arm64
        VALID_ARCHS: arm64
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          PROVISIONING_PROFILE_SPECIFIER: ""
          CODE_SIGN_ENTITLEMENTS: SaneBooks/SaneBooks.debug.entitlements
        Release:
          DEVELOPMENT_TEAM: M78L6FXD48
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_ENTITLEMENTS: SaneBooks/SaneBooks.entitlements
    postBuildScripts:
      - script: |
          "${SRCROOT}/scripts/prepare-zcash-framework.sh"
        name: Repair embedded libzcashlc macOS framework
        basedOnDependencyAnalysis: false
    dependencies:
      - package: SaneBooksPackage
        product: SaneBooksFeature

  SaneBooksTests:
    type: bundle.unit-test
    platform: macOS
    bundleId: com.saneapps.SaneBooksTests
    deploymentTarget:
      macOS: "14.0"
    sources:
      - path: SaneBooksPackage/Tests/SaneBooksCoreTests
      - path: SaneBooksPackage/Tests/SaneBooksSyncTests
      - path: SaneBooksPackage/Tests/SaneBooksExportTests
      - path: SaneBooksPackage/Tests/SaneBooksFeatureTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: SaneBooksPackage
        product: SaneBooksCore
      - package: SaneBooksPackage
        product: SaneBooksSync
      - package: SaneBooksPackage
        product: SaneBooksExport
      - package: SaneBooksPackage
        product: SaneBooksFeature
    postBuildScripts:
      - script: |
          "${SRCROOT}/scripts/prepare-zcash-framework.sh"
        name: Repair embedded libzcashlc macOS framework
        basedOnDependencyAnalysis: false

  SaneBooksUITests:
    type: bundle.ui-testing
    platform: macOS
    bundleId: com.saneapps.SaneBooksUITests
    deploymentTarget:
      macOS: "14.0"
    sources:
      - path: SaneBooksUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_TARGET_NAME: SaneBooks
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - target: SaneBooks
